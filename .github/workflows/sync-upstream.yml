
name: Automatic Upstream Backup

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-upstream-backup
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Keep scheduled workflow active
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(date -u +%u)" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            mkdir -p .archive-metadata

            date -u '+%Y-%m-%dT%H:%M:%SZ' \
              > .archive-metadata/last-check.txt

            git add .archive-metadata/last-check.txt

            if ! git diff --cached --quiet; then
              git commit -m "chore: archive heartbeat"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch="${GITHUB_REF_NAME}"

          echo "Upstream synchronization completed."
