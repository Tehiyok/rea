
name: Automatic Upstream Backup

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-backup
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with original
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          case "$REPO_NAME" in
            rea)
              UPSTREAM="morluto/rea"
              ;;
            jadx-headless-mcp)
              UPSTREAM="1013503897/jadx-headless-mcp"
              ;;
            binwalk)
              UPSTREAM="ReFirmLabs/binwalk"
              ;;
            unblob)
              UPSTREAM="onekey-sec/unblob"
              ;;
            ghidra-nativeaot)
              UPSTREAM="Washi1337/ghidra-nativeaot"
              ;;
            wakaru)
              UPSTREAM="pionxzh/wakaru"
              ;;
            *)
              echo "Unknown repository: $REPO_NAME"
              exit 1
              ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if BRANCH="$(gh api "repos/$UPSTREAM" \
            --jq '.default_branch' 2>/dev/null)"; then

            git fetch \
              "https://github.com/$UPSTREAM.git" \
              "$BRANCH"

            git merge --no-edit FETCH_HEAD
          else
            echo "::warning::Original unavailable: $UPSTREAM"
            echo "Existing backup is preserved."
          fi

          # Weekly heartbeat prevents long inactivity.
          if [ "$(date -u +%u)" = "1" ]; then
            mkdir -p .archive-metadata

            date -u '+%Y-%m-%dT%H:%M:%SZ' \
              > .archive-metadata/last-check.txt

            git add .archive-metadata/last-check.txt

            if ! git diff --cached --quiet; then
              git commit -m "chore: archive heartbeat"
            fi
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"
